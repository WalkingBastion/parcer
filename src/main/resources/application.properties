spring.application.name=vacancy-parser
server.port=8080

spring.datasource.url=jdbc:h2:mem:vacancies;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

spring.task.scheduling.pool.size=2
spring.task.scheduling.thread-name-prefix=refresh-scheduler-

app.seed-demo=true
app.pool.core=8
app.pool.max=16
app.pool.queue=200
app.pool.query-parallelism=4
app.fetch.timeout-ms=10000
app.fetch.max-urls-per-request=100
app.refresh.initial-delay-ms=20000
app.refresh.interval-ms=60000
